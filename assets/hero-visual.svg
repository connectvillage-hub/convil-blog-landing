<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A3FA7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1A3FA7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3FA7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1A3FA7" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1A3FA7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background blueprint grid -->
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Back wall -->
  <rect x="70" y="80" width="460" height="320" rx="2"
        fill="url(#wallGrad)"
        stroke="#1A3FA7" stroke-opacity="0.22" stroke-width="1.6"/>

  <!-- Floor (perspective) -->
  <path d="M 70 400 L 530 400 L 500 560 L 100 560 Z"
        fill="url(#floorGrad)"
        stroke="#1A3FA7" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="4 5"/>

  <!-- Picture frame (portfolio) -->
  <rect x="140" y="140" width="130" height="100" rx="4"
        fill="white" stroke="#1A3FA7" stroke-opacity="0.55" stroke-width="2"/>
  <line x1="158" y1="172" x2="252" y2="172" stroke="#1A3FA7" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <line x1="158" y1="192" x2="232" y2="192" stroke="#1A3FA7" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>
  <line x1="158" y1="212" x2="218" y2="212" stroke="#1A3FA7" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>

  <!-- Window with sun -->
  <rect x="340" y="130" width="140" height="120" rx="4"
        fill="white" stroke="#1A3FA7" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="410" y1="130" x2="410" y2="250" stroke="#1A3FA7" stroke-opacity="0.40" stroke-width="2"/>
  <line x1="340" y1="190" x2="480" y2="190" stroke="#1A3FA7" stroke-opacity="0.40" stroke-width="2"/>
  <circle cx="410" cy="190" r="22" fill="#FFD60A" fill-opacity="0.35"/>
  <circle cx="410" cy="190" r="14" fill="#FFD60A" fill-opacity="0.55"/>

  <!-- Sofa -->
  <rect x="120" y="395" width="220" height="78" rx="16"
        fill="#1A3FA7" fill-opacity="0.07"
        stroke="#1A3FA7" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="130" y="382" width="62" height="22" rx="7"
        fill="#1A3FA7" fill-opacity="0.18"/>
  <rect x="200" y="382" width="62" height="22" rx="7"
        fill="#1A3FA7" fill-opacity="0.18"/>
  <rect x="270" y="382" width="62" height="22" rx="7"
        fill="#1A3FA7" fill-opacity="0.18"/>
  <line x1="140" y1="473" x2="140" y2="488" stroke="#1A3FA7" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="473" x2="320" y2="488" stroke="#1A3FA7" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Coffee table -->
  <ellipse cx="395" cy="478" rx="62" ry="18"
        fill="#1A3FA7" fill-opacity="0.08"
        stroke="#1A3FA7" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="365" y1="490" x2="362" y2="510" stroke="#1A3FA7" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <line x1="425" y1="490" x2="428" y2="510" stroke="#1A3FA7" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

  <!-- Floor lamp -->
  <line x1="498" y1="298" x2="498" y2="468" stroke="#1A3FA7" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M 472 300 Q 498 262 524 300 Z"
        fill="#FFD60A" fill-opacity="0.30"
        stroke="#1A3FA7" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="498" cy="476" rx="22" ry="6" fill="#1A3FA7" fill-opacity="0.22"/>

  <!-- Plant pot -->
  <rect x="58" y="408" width="44" height="58" rx="4"
        fill="#1A3FA7" fill-opacity="0.08"
        stroke="#1A3FA7" stroke-opacity="0.45" stroke-width="2"/>
  <ellipse cx="80" cy="386" rx="16" ry="22" fill="#1A3FA7" fill-opacity="0.12"/>
  <ellipse cx="62" cy="372" rx="12" ry="18" fill="#1A3FA7" fill-opacity="0.10"/>
  <ellipse cx="98" cy="372" rx="12" ry="18" fill="#1A3FA7" fill-opacity="0.10"/>

  <!-- Floating "blog post card" - representing blog content -->
  <g transform="translate(376, 84) rotate(-4)">
    <rect width="180" height="106" rx="12"
          fill="white" stroke="#1A3FA7" stroke-opacity="0.35" stroke-width="1.6"/>
    <rect x="14" y="14" width="34" height="10" rx="5" fill="#1A3FA7" fill-opacity="0.7"/>
    <rect x="52" y="14" width="22" height="10" rx="5" fill="#FFD60A" fill-opacity="0.7"/>
    <rect x="14" y="36" width="150" height="6" rx="3" fill="#1A3FA7" fill-opacity="0.30"/>
    <rect x="14" y="50" width="130" height="6" rx="3" fill="#1A3FA7" fill-opacity="0.22"/>
    <rect x="14" y="64" width="140" height="6" rx="3" fill="#1A3FA7" fill-opacity="0.22"/>
    <rect x="14" y="82" width="60" height="14" rx="7" fill="#1A3FA7" fill-opacity="0.85"/>
    <rect x="80" y="82" width="14" height="14" rx="7" fill="#FFD60A" fill-opacity="0.85"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="546" cy="96" r="3.5" fill="#FFD60A" fill-opacity="0.7"/>
  <circle cx="50" cy="276" r="3.2" fill="#1A3FA7" fill-opacity="0.45"/>
  <circle cx="294" cy="60" r="3" fill="#FFD60A" fill-opacity="0.55"/>
  <circle cx="556" cy="404" r="2.8" fill="#1A3FA7" fill-opacity="0.4"/>
  <circle cx="40" cy="130" r="2.6" fill="#1A3FA7" fill-opacity="0.35"/>
</svg>
